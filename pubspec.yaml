name: midipro
description: Teclado para Android, iOS e navegador com SoundFonts SF2.
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_midi_pro:
    path: packages/flutter_midi_pro
  idb_shim: ^2.10.1+1
  midipro_soundfonts:
    path: packages/midipro_soundfonts
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
